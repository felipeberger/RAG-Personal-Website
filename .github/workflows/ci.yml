name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore ingest tool
        run: dotnet restore tools/ingest/Ingest.csproj

      - name: Restore tests
        run: dotnet restore tests/ingest.tests/ingest.tests.csproj

      - name: Build ingest tool
        run: dotnet build tools/ingest/Ingest.csproj --no-restore --configuration Release

      - name: Build tests
        run: dotnet build tests/ingest.tests/ingest.tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/ingest.tests/ingest.tests.csproj --no-restore --configuration Release --verbosity normal

      - name: Validate data files (dry-run)
        run: dotnet run --project tools/ingest/Ingest.csproj -- --dry-run

      - name: Upload index.json as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: index-json
          path: data/index.json
          retention-days: 7

  # Optional: Test that the tool can run without Azure credentials
  validate-ingest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore ingest tool
        run: dotnet restore tools/ingest/Ingest.csproj

      - name: Run ingest in dry-run mode
        run: dotnet run --project tools/ingest/Ingest.csproj -- --dry-run