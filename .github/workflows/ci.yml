name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-restore --configuration Release --verbosity normal

      - name: Validate data files (dry-run)
        run: dotnet run --project tools/ingest -- --dry-run
        working-directory: ${{ github.workspace }}

      - name: Upload index.json as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: index-json
          path: data/index.json
          retention-days: 7

  # Optional: Test that the tool can run without Azure credentials
  validate-ingest:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run ingest in dry-run mode
        run: dotnet run --project tools/ingest -- --dry-run
        working-directory: ${{ github.workspace }}